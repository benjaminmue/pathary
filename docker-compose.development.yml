services:
  app:
    build:
      context: ./
      dockerfile: ./build/Dockerfile
      target: development
      args:
        - USER_ID=${USER_ID:-1000}
    user: "0:0"  # Run as root to allow supervisord to manage processes as different users
    extra_hosts:
      host.docker.internal: host-gateway
    volumes:
      - ./:/app
      - /app/vendor
      - /app/storage
