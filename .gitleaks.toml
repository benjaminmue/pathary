# gitleaks configuration. Default ruleset plus allowlists for findings that
# were inspected and cleared. Anything not listed here fails the build.

[extend]
useDefault = true

[[allowlists]]
description = "REST test fixtures, the secret-scanning docs and scanner (they contain the sample patterns on purpose), and vendored upstream READMEs."
paths = [
  '''tests/rest/.*''',
  '''docs/security/.*''',
  '''build/scripts/test-cron-env\.sh''',
  '''scripts/secret-scan\.sh''',
  '''vendor/.*''',
]

[[allowlists]]
description = "Documentation examples: auth headers in curl samples, no live token."
paths = [
  '''docs/wiki/.*''',
]

[[allowlists]]
description = """Inherited upstream history. Pathary's history begins with Lee Peuker's Movary initial commit of 2021-01-24, which contained settings/config.ini with Trakt API credentials; he removed the file two commits later (87f745ad). The keys are his, not this project's, they have been public upstream since 2021, and nobody here can rotate them. Pinned by fingerprint so only this one historic blob is excused: a Trakt key committed anywhere else still fails the build."""
commits = [
  "a1c371fdd31a26d8e658ba77954a4b8774590e43",
]

[[allowlists]]
description = "False positive in commit b22745de: generic-api-key matched the environment variable name in a ternary of EncryptionServiceTest (putenv of 'ENCRYPTION_KEY' or 'ENCRYPTION_KEY=' plus a variable). No key literal. The test was rewritten in the next commit; pinned to this commit and file so nothing else is excused."
commits = [
  "b22745de8f088445b16272db34b58d9a76d80a55",
]
paths = [
  '''tests/unit/Service/EncryptionServiceTest\.php''',
]
