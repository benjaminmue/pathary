# Dependency updates. Grouped so Monday brings a couple of PRs, not thirty.
# Major bumps stay separate: they are the ones that need a real look.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 10
    groups:
      patch-and-minor:
        update-types: [minor, patch]
      major:
        update-types: [major]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
    # Stay on PHP 8.4: patch releases (security fixes) come through, a move to
    # 8.5 is a deliberate migration (vimeo/psalm 6.x does not support 8.5 yet).
    ignore:
      - dependency-name: php
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: docker
    directory: /build
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
    # trafex/php-nginx 3.11 and later ship PHP 8.5; 3.10 is the last 8.4 line.
    # The test image must run the same PHP minor as production.
    ignore:
      - dependency-name: trafex/php-nginx
        versions: [">=3.11.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
